name: Clean up mislabeled rc37 GHCR images

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    if: github.repository == 'zranba/new-api' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete only the mislabeled rc37 release images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import json
          import subprocess

          endpoint = "users/zranba/packages/container/new-api/versions"
          result = subprocess.run(
              ["gh", "api", "--paginate", "--slurp", endpoint + "?per_page=100"],
              check=True, stdout=subprocess.PIPE, text=True,
          )
          versions = [version for page in json.loads(result.stdout) for version in page]
          old_tag = "v1.0.0-rc.37-fork.1"
          new_tag = "v1.0.0-rc.40-fork.1"
          if not any({new_tag, "latest"}.issubset(version["metadata"]["container"]["tags"]) for version in versions):
              raise SystemExit("The corrected rc40 release must own latest before cleanup")

          old_tags = {old_tag, old_tag + "-amd64", old_tag + "-arm64"}
          images = [version for version in versions if old_tags.intersection(version["metadata"]["container"]["tags"])]
          signature_tags = set()
          for version in images:
              digest = version["name"].removeprefix("sha256:")
              signature_tags.update({"sha256-" + digest, "sha256-" + digest + ".sig"})
          allowed_tags = old_tags | signature_tags
          selected = [version for version in versions if allowed_tags.intersection(version["metadata"]["container"]["tags"])]
          for version in selected:
              tags = set(version["metadata"]["container"]["tags"])
              if not tags.issubset(allowed_tags):
                  raise SystemExit(f"Refusing to delete shared image version {version['id']}: {sorted(tags)}")
              print(json.dumps({"id": version["id"], "digest": version["name"], "tags": sorted(tags)}), flush=True)

          for version in selected:
              subprocess.run(["gh", "api", "--method", "DELETE", f"{endpoint}/{version['id']}"], check=True)
          result = subprocess.run(
              ["gh", "api", "--paginate", "--slurp", endpoint + "?per_page=100"],
              check=True, stdout=subprocess.PIPE, text=True,
          )
          remaining = [version for page in json.loads(result.stdout) for version in page]
          if any(allowed_tags.intersection(version["metadata"]["container"]["tags"]) for version in remaining):
              raise SystemExit("A mislabeled rc37 tag or signature is still present")
          print(f"Deleted {len(selected)} mislabeled rc37 image and signature versions; rc40 and latest remain published", flush=True)
          PYTHON
